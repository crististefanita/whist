schema_version: 1
id: "NORMAL_HARD_CONTRACT_OBJECTIVES_V1"
status: "ACTIVE_CODE_BOUND_RULES"
runtime_influence: "Implemented by AiPolicy, HandTrickPotential, NormalBidPolicy, NormalPlayPolicy, MonteCarloAi, BidConditioning, PublicSalvage, and ZeroMatchSearch."
profile: "Romanian Whist, legal moves only, four seats, public information."
information: ["own hand", "public bids", "tricks already won", "current trick", "public card history", "turned card", "remaining opportunities", "public scores"]
one_card_bid_model:
  owner: "OneCardBidBelief"
  auction: { hand_size: 1, private_cards: 1, trick_cards: 0, history_cards: 0 }
  conditioning:
    modes: ["ROMANIAN_WHIST", "LONG_ROMANIAN"]
    seats: 4
    turned_card_required: true
  fallback: "UNCONDITIONED_ONE_CARD_PROBABILITY"
  forced_dealer_bid: "NO_STRENGTH_EVIDENCE"
  limit: "Entry selection and conditioned-bid support are distinct. This descriptive contract does not change coefficients, priors or calibrated scope."
normal:
  objective: "Pursue the player's own bid through the entire hand unless the optional match-level zero objective activates."
  remaining_need: "own bid - own tricks already won; preserve the sign."
  policy:
    - id: "NORMAL_TAKE_WHILE_SHORT"
      rule_ro: "Cât timp mai lipsesc levate, caută o carte care poate câștiga levata; dacă nu există, păstrează cea mai puternică posibilitate pentru următoarea levată."
      rule_en: "While tricks are still needed, take the trick when the current position allows it; otherwise preserve the strongest future chance."
      tests: ["normalLeadsWithStrengthWhileAContractRemains", "normalTakesAReachableTrickAndUsesTheSmallestCertainWinnerWhenLast"]
    - id: "NORMAL_DUCK_AFTER_TARGET"
      rule_ro: "După atingerea contractului, evită levatele suplimentare. Când toate cărțile pierd, folosește cartea cu putere mai mare pentru a reduce riscul ulterior."
      rule_en: "After reaching the bid, avoid extra tricks. When the current trick is already lost, shed the higher exposed card to reduce later risk."
      tests: ["normalShedsTheLowestRiskWhenNoTrickIsNeeded"]
  information_boundary: "The policy input contains its own hand and public seat state only; opponent card lists are removed before the decision method is called."
  tests: ["bothDifficultiesReceiveOnlyTheActorsHandAndPublicSeatStates"]
  limit: "Transparent local heuristic for ordinary contract pursuit. Match-level zero has its own public-world planner."
hand_potential:
  owner: "HandTrickPotential, consumed by BidConditioning only."
  rule: "A same-suit lower card adds capped cover value to a king when the ace is not held; longer queen sequences add a smaller value. A void or singleton in a non-trump suit adds modest ruff flexibility only when trump is held, scaled by trump count. These are soft clues for interpreting an opponent bid, not certain tricks and not a change to Normal's bid policy."
  shape_weights: { void: 0.22, singleton: 0.03, trump_scale: "min(trump_count / 2, 1)" }
  tests: ["aCoveredKingCarriesNearlyAceLevelPotentialWithoutBecomingACertainty", "shortSideSuitsGainOnlyModestRuffFlexibilityWhenTrumpIsHeld"]
independent:
  scope: "Test-only independent implementation; it does not call the Hard engine."
  objective: ["own expected Romanian points", "lower strongest rival score"]
  public_context:
    remaining_need: "For every seat, recompute bid - tricks already won after each completed trick."
    voids: "Combine completed public history with the unfinished table; an off-suit non-trump Romanian discard proves no led suit and no trump."
    bids: "Submitted bids remain literal continuation targets; the independent implementation does not weight hidden assignments by bid likelihood."
  hidden_worlds:
    small_endgame: "The independent contract certifier enumerates every compatible assignment for four seats when each opponent has at most two cards, the unseen pool has at most ten cards, and the complete set is at most 256 worlds."
    card_planner: "Independent card choices use constrained sampled worlds; complete enumeration supplies the bounded contract certifier."
    otherwise: "Constrained samples describe compatible deals but are not proven to be uniformly distributed."
  continuation: "The card planner uses heuristic rollouts; exhaustive hidden-world certification does not mean perfect-information play or perfect strategy."
  tests: ["currentTrickDiscardConstrainsIndependentWorldsEvenWhenHistoryOmitsItsSuffix", "independentCardOrderEnumeratesEverySmallPubliclyFeasibleWorld", "bothDifficultiesReceiveOnlyTheActorsHandAndPublicSeatStates"]
  limitations: ["The bid likelihood does not use actual opponent cards and is not a calibrated posterior.", "Large information sets still use constrained samples.", "No perfect-play claim."]
hard:
  objective: "Maximize own exact-contract probability while the public state leaves a route to the bid."
  switch_to_salvage_when: "The public lower bound on unavoidable wins exceeds remaining need, or remaining need exceeds remaining trick opportunities."
  salvage:
    rule_ro: "Când limitele publice dovedesc că propriul contract nu mai poate fi realizat, Hard păstrează punctajul propriu înaintea ratărilor adverse cât timp mai sunt peste două levate. În ultimele două levate trece la prioritatea de ardere: maximizează adversarii care ratează, apoi punctajul propriu estimat. Certificatul finit rămâne mai prudent: în fiecare lume candidatul trebuie să nu înrăutățească punctele proprii și ratările adverse față de propunerea de bază. Normal nu folosește profilul de ardere."
    rule_en: "When public bounds prove the own contract unreachable, Hard protects own points before rival misses while more than two tricks remain. In the final two tricks it switches to burn priority: maximize opponents who miss, then own expected points. The finite certificate remains conservative: in every world the candidate may not worsen own points or rival misses against the baseline proposal. Normal never enters the burn profile."
    certificate_scope: "Four-seat Romanian hands with two cards remaining; all feasible hidden deals and all legal continuations, bounded by the configured search limit."
    tests: ["certifiedLeadBurnsThreeRivalsInsteadOfTwoWithoutWorseningOwnPenalty", "recoverableContractCannotBeSacrificedForRivalDamage", "anImpossibleContractUsesRivalMissPriorityWithoutClaimingProof"]
  fallback: "For a publicly unreachable contract without a complete certificate, preserve expected own points first except in the final two tricks, when production Hard prioritizes rollout-estimated opponent contract misses and then own points; use the strongest rival score only as a final tie break."
  ranking:
    feasible: ["exact_contract_probability", "own_expected_points", "lower_strongest_rival_score"]
    publicly_impossible: ["own_expected_points", "expected_rival_contract_misses", "lower_strongest_rival_score"]
    final_two_tricks: ["expected_rival_contract_misses", "own_expected_points", "lower_strongest_rival_score"]
    weighting: "State-dependent lexicographic priorities, not learned numeric weights. Recomputed after every public bid or played card."
  inference:
    unseen_pool: "Remove own cards, publicly played cards, current-trick cards, and the turned-up trump."
    ownership_constraints: "Sample only deals consistent with inferred suit voids from the full public history and current table."
    public_bids: "Use known bids as contract targets and scoring outcomes during rollouts."
    bid_conditioned_hand_likelihood: "At 2-8 cards in four-seat Romanian Whist, reconstruct each bidder's original hand from the sampled remaining hand plus distinct public plays. For each known bid with a complete legal prefix and more than one legal value, multiply a tempered soft likelihood: 65% uniform support plus 35% normalized Gaussian around HandTrickPotential.score, dispersion 0.90 bids, temperature 0.25 at two cards and 0.50 at three through eight. Forced, missing-prefix, and own bids add no evidence. Recompute after public cards and void constraints change. This is a regularized relative likelihood over the existing sampler, not a calibrated posterior. At one card, retain the specialized OneCardBidBelief domain."
    cover_rule: "An unaccompanied king is weaker than a king with a lower same-suit cover; the cover bonus is capped and remains an estimate because lead order, remaining higher cards, trumps, and legal follow-suit constraints determine the actual trick chance."
    effective_sample_size: "Weighted bid/card estimates report effective sample size; bid sampling continues until its existing confidence gate or budget, while card worlds retain the declared bounded sampler."
    information_boundary: "The Hard decision view likewise contains only the actor's own hand and public information; simulated hidden deals are generated after observation and never expose the actual opponent holdings."
    tests: ["aCoveredKingCarriesNearlyAceLevelPotentialWithoutBecomingACertainty", "shortSideSuitsGainOnlyModestRuffFlexibilityWhenTrumpIsHeld", "publicBidsPreferCompatibleDealsButRetainSupportForUnusualHands", "twoCardBidEvidenceIsMoreConservativeThanTheLongerHandModel", "completedPublicCardsReconstructTheBidTimeHandWithoutDoubleCounting", "aCardInTheUnfinishedTrickIsAuctionEvidenceEvenIfHistoryOmitsItsSuffix", "missingBidPrefixIsNotInventedAsEvidence", "forbiddenLastBidIsIgnoredButALegalLastBidRemainsEvidence", "aLegalLastBidUpdatesThePosteriorFromTheBidderHandNotThePositionAlone", "romanianBidLikelihoodDoesNotLeakIntoOhHell", "auctionInferenceAndLateBurnStayScopedToCalibrated181", "longRomanianAuctionEvidenceRemainsNeutralUntilItsOwnCalibrationExists", "absentOrIncompleteAuctionEvidenceLeavesWorldWeightsNeutral", "fourSeatBidConditioningStaysNeutralAtOtherRomanianTableSizes", "weightedBidSamplesReportTheEffectiveRatherThanRawSampleCount", "lowWeightWorldsCannotInflateTheBidStoppingConfidence", "productionHardBurnsOnlyInTheLastTwoTricksAfterPublicImpossibility", "runsAndCapturesACompleteFourSeatMockMatch", "replaysTheSameDealsAndTurnOrderAcrossHardSeatPerspectives", "comparesBidAndCardProfilesOnTheSameDealsAtEverySeat", "currentTrickDiscardConstrainsHiddenHandsBeforeTheTrickIsScored", "publicIrrecoverabilityRanksOwnPointsBeforeRivalMisses", "rolloutUtilityCountsHowManyOpponentsMiss", "turnedTrumpIsExcludedFromTheUnseenPoolAndEverySampledHand"]
  limitations: ["Salvage certificate currently covers two-card endings only.", "Bid-conditioned likelihood at 2-8 cards regularizes the existing sampler; it is not a calibrated posterior and does not model opponents' card-choice behavior.", "Calibrate bid likelihood by first, middle, and last auction position and validate on both homogeneous and mixed-policy rosters; aggregate-only gains and tuning seeds are not held-out evidence.", "No claim of perfect Hard play or universal perfect play."]
zero_match:
  variants: ["ROMANIAN_WHIST", "LONG_ROMANIAN"]
  players: [3, 4, 5, 6]
  difficulties: ["NORMAL", "HARD"]
  activation: "Rule enabled; a public proof rules out the conventional top two, and an exact-zero continuation remains arithmetically reachable."
  hard_podium_proof: "Once all bids are public, the rivals the actor would need to catch must share the remaining tricks in the current hand. If the cheapest such group cannot fit the budget in any own result, the podium is excluded. A possible tie counts as reachable. A current trick the actor cannot legally win is excluded from the actor's ceiling."
  hard_reserve: "Before the final hand, with two to four tricks left and more than one legal card, compare at most 64 fully enumerated public deals. Where either choice can still lead to the conventional top two, all legal continuations must yield the same trick totals for every player. Where the podium is excluded, the alternative preserves existing routes and, with four tricks left, may replace a contingent route with a guaranteed one. An incomplete enumeration or continuation proof keeps the conventional card."
  bounds: "Evaluate each possible result of the current hand together with the remaining schedule. Its next streak determines the maximum remaining streak payouts for that seat."
  precedence: "Recompute before bidding and before playing. Use the level's ordinary policy if no eligible action has support."
  one_card_auction: "The dealer bids zero after a prior total of zero, one after a prior total of one, and may choose either after a larger total. A mandatory bid bypasses strategy selection and supplies no card-strength evidence."
  suffix: "Combine distinct scoring outcomes with equal weights over the actual schedule, including the configured streak transitions."
  final_hand: "Compare each trick count that produces exact zero as a distinct continuation over the same public worlds."
  final_tie: "On a bid or lead, or when following with the target still ahead, prefer a smaller expected absolute closing balance. When following and the number of tricks already won settles the balance, use conventional points after equal exact-zero support."
  penultimate_tie: "Prefer final bid and trick-count pairs that settle the balance. When the actor closes the next auction, compare adjacent legal trick counts that would still miss, to account for one-trick errors."
  action_priority: ["estimated_support_for_exact_zero", "phase_specific_tie_break", "expected_conventional_points"]
  final_score: "After all scheduled hands and streak adjustments, each raw total of 0 becomes a final score of 500. The hand ledger stays raw."
  limitation: "Public ranking bounds are conservative. Abstract suffix weights are not calibrated joint match probabilities."
evolution:
  recompute_after: "Every public bid and every card played."
  accepted_evidence: "Small legal component examples plus same-deal paired complete matches, seat rotation, and fresh seeds; compare each strategy profile at the same seat before promotion."
  rejected_experiments: "Keep outside runtime until all predeclared strength and non-regression gates pass."
  private_information: "Never use actual opponent hands to choose a public strategy."

offline_experiment_profiles:
  runtime_influence: false
  focal_seats: [0, 1, 2, 3]
  opponents: "Three Normal policies; one profile-controlled Hard seat."
  profiles:
    CURRENT:
      bid_priority: ["exact_contract_probability", "expected_points"]
      card_priority: ["exact_contract_probability", "expected_points", "lower_strongest_rival_score"]
    PRUDENT_BID_04:
      bid_rule: "Choose the lowest legal bid whose estimated exact-contract probability is within 0.04 of the highest estimate."
      max_exact_probability_gap: 0.04
      card_priority: "Same as CURRENT."
    PRUDENT_BID:
      bid_rule: "Choose the lowest legal bid whose estimated exact-contract probability is within 0.08 of the highest estimate."
      max_exact_probability_gap: 0.08
      card_priority: "Same as CURRENT."
    PRUDENT_BID_12:
      bid_rule: "Choose the lowest legal bid whose estimated exact-contract probability is within 0.12 of the highest estimate."
      max_exact_probability_gap: 0.12
      card_priority: "Same as CURRENT."
    SCORE_FIRST:
      bid_priority: ["expected_points", "exact_contract_probability"]
      card_priority: ["expected_points", "exact_contract_probability", "lower_strongest_rival_score"]
    BURN_IF_DOOMED:
      bidding: "Same as CURRENT."
      fallback_only_when_public_quota_proves_own_contract_impossible:
        priority: ["expected_rival_contract_misses", "own_expected_points", "lower_strongest_rival_score"]
  paired_evaluation:
    same_deal_sequence: true
    vary: ["Hard seat strategy profile", "public bids selected by that profile", "legal card choices selected from current public context"]
    do_not_record: ["future hidden cards", "opponent private hands", "opaque deal commitments"]
    report: ["bid-option estimates", "selected bids", "card-action differences", "exact contracts", "overtricks", "undertricks", "points"]
    promotion: "No experimental profile changes production difficulty until it beats CURRENT across fresh seeds and all four seats without rule or score regressions."
